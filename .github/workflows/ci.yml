name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: pytest
        run: uv run pytest -q

  import-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"
      - run: uv sync
      - name: sengol must never be importable as a dependency of sengol_verify
        run: uv run pytest -q tests/test_no_sengol_dependency.py
      - name: built wheel metadata declares no sengol dependency
        run: |
          uv build --wheel -o /tmp/dist
          python3 - <<'EOF'
          import glob, zipfile

          wheel = sorted(glob.glob("/tmp/dist/*.whl"))[0]
          with zipfile.ZipFile(wheel) as zf:
              metadata_name = next(n for n in zf.namelist() if n.endswith("METADATA"))
              metadata = zf.read(metadata_name).decode()

          for line in metadata.splitlines():
              if line.startswith("Requires-Dist:") and "sengol-verify" not in line:
                  assert "sengol" not in line.lower().split(":", 1)[1].split(";")[0], (
                      f"wheel depends on sengol: {line!r}"
                  )
          print("OK: wheel declares no sengol dependency")
          EOF
